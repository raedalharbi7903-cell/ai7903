name: Repository quality
on:
  push:
    branches: [feature/crypto-analysis-validation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, Node 24
        with:
          version: "11.25.0"
          package_json_file: frontend/package.json
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Install backend development environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements/dev.txt
      - name: Test verification tooling
        run: backend/.venv/bin/python -m unittest discover -s scripts -p 'test_*.py'
      - name: Run all backend and frontend gates
        env:
          # Native source mapping preserves useful startup diagnostics if a
          # dependency's own stack mapper fails on the Linux runner.
          NODE_OPTIONS: --enable-source-maps
        run: backend/.venv/bin/python scripts/verify.py
      - name: Capture original frontend startup diagnostics
        if: failure()
        working-directory: frontend
        run: node tests/diagnose-startup.mjs
      - name: Audit documentation links
        if: always()
        run: backend/.venv/bin/python scripts/audit_documents.py
      - name: Verify disposable PostgreSQL migrations and recovery
        if: always()
        run: backend/.venv/bin/python scripts/postgres_acceptance.py
      - name: Build backend container
        id: container-build
        if: always()
        run: docker build -t ai-analysis-backend:ci backend
      - name: Verify container runtime boundaries
        if: always() && steps.container-build.outcome == 'success'
        run: backend/.venv/bin/python scripts/smoke_container.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: verification-evidence
          archive: true
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
